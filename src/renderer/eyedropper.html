<!doctype html>
<!--
  The eyedropper's floating chip.

  Its own tiny document rather than part of the main renderer, because the main
  window is HIDDEN while the eyedropper runs - that is the whole point, so the
  user is not picking a pixel of MacroBoard. This window is the only UI left
  visible, and it must be click-through so it never intercepts the pick.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Same strict policy as the main window: no remote anything. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Eyedropper</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        /* No cursor of our own: the chip must never suggest it is clickable. */
        cursor: none;
        user-select: none;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
      }
      #chip {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 100%;
        padding: 0 11px;
        box-sizing: border-box;
        border-radius: 9px;
        /* A visible outline matters: the chip floats over arbitrary content,
           and on a white app it would otherwise be invisible. */
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(16, 18, 26, 0.94);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        color: #e6e9f2;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      #swatch {
        width: 26px;
        height: 26px;
        flex: 0 0 26px;
        border-radius: 5px;
        background: #000;
        /* Same reason as the border: the swatch needs an edge to be seen against
           a matching background. */
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }
      #text {
        overflow: hidden;
        text-overflow: ellipsis;
        color: #e6e9f2;
      }
      /* A hint is a different kind of message from a value, so it reads
         differently rather than replacing the element. */
      #text.hint {
        color: #ffb340;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="chip">
      <div id="swatch"></div>
      <div id="text">Move the mouse…</div>    </div>
    <script src="eyedropper-chip.js"></script>
  </body>
</html>
